<g transform="translate(409,71)">
  <rect width="390" height="58" rx="12" class="card"/>
  <circle cx="26" cy="22" r="5" fill="#5B7FB5">
    <animate attributeName="r" values="4;6.5;4" dur="2.4s" begin="1.2000000000000002s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="1.2000000000000002s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="27" class="t">Automação com Python</text>
  <text x="44" y="44" class="s">Scripts para tarefas repetitivas</text>
  <g transform="translate(35,49)">
    <rect width="320" height="3" rx="1.5" class="track"/>
    <g clip-path="url(#bar)"><rect x="-120" y="0" width="120" height="3" fill="url(#shine)">
      <animate attributeName="x" values="-120;320" dur="2.8s" begin="1.5s" repeatCount="indefinite"/>
