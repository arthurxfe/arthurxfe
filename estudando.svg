  .h{font-size:22px;font-weight:700;fill:#e6e9ef;letter-spacing:.5px}
</style>
<rect width="800" height="330" rx="20" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="799" height="329" rx="20" fill="none" stroke="#3a5276"/>
