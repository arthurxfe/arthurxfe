<svg xmlns="http://www.w3.org/2000/svg" width="800" height="130" viewBox="0 0 800 130" role="img" aria-label="Atualmente estudando" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5B7FB5" stop-opacity="0"/><stop offset="0.5" stop-color="#6f93cf" stop-opacity="1"/><stop offset="1" stop-color="#5B7FB5" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="bar"><rect x="0" y="0" width="320" height="3" rx="1.5"/></clipPath>
</defs>
<style>
  text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
  .t{font-size:15px;font-weight:700;fill:#1b2a41}
  .s{font-size:12px;fill:#5b6b82}
  .card{fill:#f3f5f9;stroke:#c5cfdd}
  .track{fill:#dde3ec}
  @media (prefers-color-scheme: dark){
    .t{fill:#e6e9ef}
    .s{fill:#aab6c8}
    .card{fill:#1b2a41;fill-opacity:.7;stroke:#3a5276}
    .track{fill:#2c4260}
  }
</style>
<g transform="translate(1,1)">
  <rect width="390" height="58" rx="12" class="card"/>
  <circle cx="26" cy="22" r="5" fill="#5B7FB5">
    <animate attributeName="r" values="4;6.5;4" dur="2.4s" begin="0.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="0.0s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="27" class="t">Estruturas de Dados</text>
  <text x="44" y="44" class="s">Organizar e manipular dados</text>
  <g transform="translate(35,49)">
    <rect width="320" height="3" rx="1.5" class="track"/>
    <g clip-path="url(#bar)"><rect x="-120" y="0" width="120" height="3" fill="url(#shine)">
      <animate attributeName="x" values="-120;320" dur="2.8s" begin="0.0s" repeatCount="indefinite"/>
    </rect></g>
  </g>
</g>
<g transform="translate(409,1)">
  <rect width="390" height="58" rx="12" class="card"/>
  <circle cx="26" cy="22" r="5" fill="#5B7FB5">
    <animate attributeName="r" values="4;6.5;4" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="27" class="t">APIs REST</text>
  <text x="44" y="44" class="s">Criar e consumir APIs com Python</text>
  <g transform="translate(35,49)">
    <rect width="320" height="3" rx="1.5" class="track"/>
