<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310" role="img" aria-label="Atualmente estudando" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#aab6c8"/><stop offset="1" stop-color="#5B7FB5"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5B7FB5" stop-opacity="0"/><stop offset="0.5" stop-color="#6f93cf" stop-opacity="1"/><stop offset="1" stop-color="#5B7FB5" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="bar"><rect x="0" y="0" width="320" height="6" rx="3"/></clipPath>
</defs>
<style>
  text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
  .h{font-size:22px;font-weight:700;fill:#1b2a41;letter-spacing:.5px}
  .t{font-size:17px;font-weight:700;fill:#1b2a41}
  .s{font-size:12.5px;fill:#5b6b82}
  .card{fill:#f3f5f9;stroke:#c5cfdd}
  .track{fill:#dde3ec}
  @media (prefers-color-scheme: dark){
    .h{fill:#e6e9ef}
    .t{fill:#e6e9ef}
    .s{fill:#aab6c8}
    .card{fill:#1b2a41;fill-opacity:.7;stroke:#3a5276}
    .track{fill:#2c4260}
  }
</style>
<text x="40" y="42" class="h">Atualmente estudando</text>
<rect x="40" y="54" width="90" height="4" rx="2" fill="url(#accent)"/>
<g transform="translate(30,80)">
  <rect width="360" height="100" rx="14" class="card"/>
  <circle cx="30" cy="34" r="6" fill="#5B7FB5">
    <animate attributeName="r" values="5;8;5" dur="2.4s" begin="0.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="0.0s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="40" class="t">Estruturas de Dados</text>
  <text x="24" y="64" class="s">Organizar e manipular dados com eficiência</text>
  <g transform="translate(20,78)">
    <rect width="320" height="6" rx="3" class="track"/>
    <g clip-path="url(#bar)">
      <rect x="-120" y="0" width="120" height="6" fill="url(#shine)">
        <animate attributeName="x" values="-120;320" dur="2.8s" begin="0.0s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</g>
<g transform="translate(410,80)">
  <rect width="360" height="100" rx="14" class="card"/>
  <circle cx="30" cy="34" r="6" fill="#5B7FB5">
    <animate attributeName="r" values="5;8;5" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="40" class="t">APIs REST</text>
  <text x="24" y="64" class="s">Criar e consumir APIs com Python</text>
  <g transform="translate(20,78)">
    <rect width="320" height="6" rx="3" class="track"/>
    <g clip-path="url(#bar)">
      <rect x="-120" y="0" width="120" height="6" fill="url(#shine)">
        <animate attributeName="x" values="-120;320" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</g>
<g transform="translate(30,195)">
  <rect width="360" height="100" rx="14" class="card"/>
  <circle cx="30" cy="34" r="6" fill="#5B7FB5">
    <animate attributeName="r" values="5;8;5" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="40" class="t">Engenharia de Software</text>
  <text x="24" y="64" class="s">Boas práticas, Git e trabalho em equipe</text>
  <g transform="translate(20,78)">
    <rect width="320" height="6" rx="3" class="track"/>
    <g clip-path="url(#bar)">
      <rect x="-120" y="0" width="120" height="6" fill="url(#shine)">
        <animate attributeName="x" values="-120;320" dur="2.8s" begin="1.0s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</g>
<g transform="translate(410,195)">
  <rect width="360" height="100" rx="14" class="card"/>
  <circle cx="30" cy="34" r="6" fill="#5B7FB5">
    <animate attributeName="r" values="5;8;5" dur="2.4s" begin="1.2000000000000002s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" begin="1.2000000000000002s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="40" class="t">Automação com Python</text>
  <text x="24" y="64" class="s">Scripts que eliminam tarefas repetitivas</text>
  <g transform="translate(20,78)">
    <rect width="320" height="6" rx="3" class="track"/>
    <g clip-path="url(#bar)">
      <rect x="-120" y="0" width="120" height="6" fill="url(#shine)">
        <animate attributeName="x" values="-120;320" dur="2.8s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</g>
</svg>
