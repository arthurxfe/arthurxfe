  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.250;0.470" dur="1.6s" begin="0s" fill="freeze"/>
  <rect x="240" y="156" width="121" height="38" rx="19" class="pill"/>
  <circle cx="260" cy="175" r="5" fill="#009688"/>
  <text x="274" y="180" class="p">REST API</text>
</g>
<g opacity="1">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.320;0.540" dur="1.6s" begin="0s" fill="freeze"/>
  <rect x="373" y="156" width="104" height="38" rx="19" class="pill"/>
  <circle cx="393" cy="175" r="5" fill="#8b6fd6"/>
  <text x="407" y="180" class="p">OpenAI</text>
</g>
<line x1="40" y1="210" x2="760" y2="210" class="sep"/>
