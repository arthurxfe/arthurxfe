  <rect x="356" y="88" width="62" height="38" rx="19" class="pill"/>
  <circle cx="376" cy="107" r="5" fill="#00599C"/>
  <text x="390" y="112" class="p">C</text>
</g>
<g opacity="1">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.180;0.400" dur="1.6s" begin="0s" fill="freeze"/>
  <rect x="430" y="88" width="104" height="38" rx="19" class="pill"/>
  <circle cx="450" cy="107" r="5" fill="#0F80CC"/>
  <text x="464" y="112" class="p">SQLite</text>
</g>
