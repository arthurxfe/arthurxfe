  <rect x="331" y="224" width="104" height="38" rx="19" class="pill"/>
  <circle cx="351" cy="243" r="5" fill="#6b7a90"/>
  <text x="365" y="248" class="p">GitHub</text>
</g>
<g opacity="1">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.530;0.750" dur="1.6s" begin="0s" fill="freeze"/>
  <rect x="447" y="224" width="112" height="38" rx="19" class="pill"/>
