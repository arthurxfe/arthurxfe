<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-label="Tecnologias e ferramentas" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#aab6c8"/><stop offset="1" stop-color="#5B7FB5"/></linearGradient>
</defs>
<style>
  text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
  .h{font-size:22px;font-weight:700;fill:#1b2a41;letter-spacing:.5px}
  .l{font-size:12px;font-weight:600;fill:#5b6b82;letter-spacing:2px;text-transform:uppercase}
  .p{font-size:14px;font-weight:600;fill:#1b2a41}
  .pill{fill:#f3f5f9;stroke:#c5cfdd}
  .sep{stroke:#d5dce6}
  @media (prefers-color-scheme: dark){
    .h{fill:#e6e9ef}
    .l{fill:#aab6c8}
    .p{fill:#e6e9ef}
    .pill{fill:#1b2a41;fill-opacity:.7;stroke:#3a5276}
    .sep{stroke:#2c4260}
  }
</style>
<text x="40" y="42" class="h">Tecnologias e Ferramentas</text>
<rect x="40" y="54" width="90" height="4" rx="2" fill="url(#accent)"/>
<text x="40" y="113" class="l">Linguagens e dados</text>
<g opacity="1">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.040;0.260" dur="1.6s" begin="0s" fill="freeze"/>
  <rect x="240" y="88" width="104" height="38" rx="19" class="pill"/>
  <circle cx="260" cy="107" r="5" fill="#3776AB"/>
  <text x="274" y="112" class="p">Python</text>
</g>
<g opacity="1">
